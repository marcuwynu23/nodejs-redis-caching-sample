services:
  db:
    image: postgres:16-alpine
    container_name: redis_demo_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=redis_demo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d redis_demo"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # Redis Caching Service
  redis:
    image: redis:7-alpine
    container_name: redis_demo_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
